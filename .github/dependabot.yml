# Grouping and auto-merge are co-designed: see .github/workflows/dependabot-auto-merge.yml.
#
# Every group carries `update-types: [minor, patch]`. That is what makes grouped
# PRs reliably auto-mergeable: dependabot/fetch-metadata reports a grouped PR's
# HIGHEST semver bump, so a single major inside a group would mark the whole
# batch semver-major and strand the safe updates behind a human review.
# Majors therefore arrive as their own PRs, which the auto-merge workflow skips.
#
# `applies-to: version-updates` scopes the grouping to routine churn only.
# Security advisories ignore grouping entirely and always get their own PR.
#
# No `target-branch` anywhere: security updates skip any entry that sets one
# (GitHub docs: "you should not specify a target-branch") and always target the
# default branch, which is already master.

version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns: ["*"]
    commit-message:
      prefix: "deps"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns: ["*"]
    commit-message:
      prefix: "ci"

# Deliberately no `ignore` block for majors. Unlike `groups`, `ignore` has no
# `applies-to` switch, so `update-types: [version-update:semver-major]` would
# suppress major-version SECURITY advisories as well as routine updates -- the
# exact notification this repo was hardened to receive. Majors arrive as solo
# PRs that auto-merge skips; close the unwanted ones by hand.
