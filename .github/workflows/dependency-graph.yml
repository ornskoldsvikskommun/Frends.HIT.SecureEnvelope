# Submits the RESOLVED dependency graph to GitHub.
#
# Why this exists: GitHub's dependency graph parses .csproj files, so on its
# own it only sees packages you reference directly. A vulnerable transitive
# package -- which is how System.Security.Cryptography.Xml normally arrives --
# never raises a Dependabot alert without this. The action runs a real restore
# and uploads what actually resolved.
#
# Check first: Settings -> Advanced Security -> "Automatic dependency
# submission". If that toggle is available for NuGet on this repo, enable it
# and delete this workflow -- it does the same job with no YAML to maintain.

name: dependency-graph

on:
  push:
    branches: [master]
  schedule:
    # Mondays 05:00 UTC (07:00 Stockholm in summer, 06:00 in winter).
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    name: Submit resolved dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Detect and submit components
        uses: advanced-security/component-detection-dependency-submission-action@v0
